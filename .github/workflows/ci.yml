name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cbe_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cbe_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cbe_platform?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Apply migrations to ephemeral PostgreSQL
        run: pnpm db:migrate:deploy
      - name: Verify PostgreSQL tenant constraints
        run: pnpm db:test:constraints
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build applications
        run: pnpm build
      - name: Run API unit tests
        run: pnpm --filter @cbe/api test
