name: Initialize and verify Cloudflare vinext

on:
  push:
    branches:
      - feat/cloudflare-vinext-adapter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    if: github.ref == 'refs/heads/feat/cloudflare-vinext-adapter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-vinext-adapter
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install current workspace
        run: pnpm install --frozen-lockfile
      - name: Initialize Cloudflare vinext non-interactively
        working-directory: apps/web
        run: pnpm dlx vinext init --platform=cloudflare --name=cbe --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Add generated types and lint ignores
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/tsconfig.json';
          const tsconfig = JSON.parse(fs.readFileSync(path, 'utf8'));
          tsconfig.include = [...new Set([...(tsconfig.include || []), '.cloudflare/types'])];
          fs.writeFileSync(path, JSON.stringify(tsconfig, null, 2) + '\n');
          const eslintPath = 'eslint.config.mjs';
          let eslint = fs.readFileSync(eslintPath, 'utf8');
          eslint = eslint.replace('"**/.next/**",', '"**/.next/**", "**/.cloudflare/**", "**/.vinext/**",');
          fs.writeFileSync(eslintPath, eslint);
          NODE
      - name: Resolve and install generated dependencies
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Build the Worker locally (no deployment)
        run: pnpm --filter @cbe/web run build:vinext
      - name: Commit verified configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: initialize Cloudflare vinext adapter"
            git push
          fi
